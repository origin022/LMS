name: Full Stack Dockerized Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: test_password
      SECRET_KEY: test_secret_key_123
      # السر هنا: في الـ CI نلغي ربط المجلد الخارجي ليعتمد الدوكر على الكود الذي تم عمل له COPY
      BACKEND_VOLUME_PATH: /tmp/ignore_me 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Dummy Dir for CI
        run: mkdir -p /tmp/ignore_me

      - name: Build and Start Services
        run: |
          docker compose up --build -d db backend
        
      - name: Wait for DB to be ready
        run: |
          # الانتظار حتى تستجيب قاعدة البيانات تماماً
          docker compose exec -T db sh -c "until pg_isready -U postgres; do sleep 1; done"

      - name: Run Backend Pytest
        run: |
          # تشغيل التست باستخدام uv داخل الحاوية
          docker compose exec -T backend uv run pytest tests/ -v
        env:
          PYTHONPATH: src

      - name: Check Containers Logs on Failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs db