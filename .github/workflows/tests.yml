name: Backend Dockerized Tests

on:
  push:
    branches: [ dev ] # الفحص عند الرفع لفرع التطوير فقط
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ] # الفحص عند محاولة دمج الكود في المين
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    # ميزة الإلغاء التلقائي: إذا رفعت كود جديد، يلغي الفحص القديم فوراً
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # المتغيرات السرية
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      
      # إعدادات الداتابيس للتست
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: lms
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DATABASE_URL: postgresql://postgres:password@localhost:5432/lms

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: ./backend 
        # ملاحظة: uv sync هنا سيستخدم uv.lock الذي رفعت فيه torch
        run: uv sync

      - name: Create media directory
        working-directory: ./backend
        run: mkdir -p media

      - name: Run Pytest
        working-directory: ./backend    
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+asyncpg://postgres:password@localhost:5432/lms
          PYTHONPATH: .
        run: uv run pytest tests/ -v