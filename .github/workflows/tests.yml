name: Backend Dockerized Tests

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    # تعريف المتغيرات التي يحتاجها الـ Compose والـ Dockerfile
    env:
      POSTGRES_PASSWORD: password
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'test_secret_key_123' }}
      DATABASE_URL: postgresql://postgres:password@db:5432/lms
      # هذا المسار الوهمي مهم جداً لمنع الـ Volume من مسح الكود داخل الحاوية في CI
      BACKEND_VOLUME_PATH: /tmp/ignore_me
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CI Directory
        run: mkdir -p /tmp/ignore_me

      - name: Build and Start Services
        # بناء وتشغيل الباك أند والقاعدة كما هو معرف في docker-compose.yml
        run: docker compose up --build -d db backend

      - name: Wait for Services (Health Check)
        run: |
          # الانتظار حتى تصبح قاعدة البيانات جاهزة تماماً
          echo "Waiting for DB..."
          docker compose exec -T db sh -c "until pg_isready -U postgres -d lms; do sleep 1; done"
          
          # التأكد من أن الباك أند لم ينهار عند الإقلاع
          if [ "$(docker inspect -f '{{.State.Running}}' $(docker compose ps -q backend))" != "true" ]; then
            echo "❌ Backend container crashed! Logs:"
            docker compose logs backend
            exit 1
          fi

      - name: Run Pytest inside Container
        # هنا ننفذ التست "داخل" الحاوية لضمان تطابق البيئة
        run: |
          docker compose exec -T backend pytest tests/ -v
        env:
          # نمرر المسار البرمجي لكي يجد pytest الموديلات داخل src
          PYTHONPATH: src

      - name: Check Logs on Failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs db