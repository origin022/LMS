name: Backend Dockerized Tests

on:
  push:
    branches: [ main, dev ]
    paths: ['backend/**']
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # خطوة مهمة: إنشاء ملف .env وهمي لكي لا يعترض دوكر كومبوز
      - name: Create dummy .env file
        run: |
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=12345" >> .env
          echo "POSTGRES_DB=lms" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://postgres:12345@db:5432/lms" >> .env

      - name: Start Services
        run: |
          docker compose up -d db backend
          # ننتظر التأكد من أن قاعدة البيانات جاهزة لاستقبال الاتصالات
          sleep 20 

      - name: Run Pytest inside Container
        run: |
          docker compose exec -T backend uv run pytest tests/ -v
        env:
          # نمرر رابط قاعدة البيانات الخاص بالتست
          SQLALCHEMY_DATABASE_URI: postgresql+asyncpg://postgres:12345@db:5432/lms
          PYTHONPATH: .