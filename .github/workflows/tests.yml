name: Backend Dockerized Tests

on:
  push:
    branches: [ main, dev ]
    paths: ['backend/**', 'tests/**']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build and Start Services
        run: |
          docker compose --env-file .env up --build -d db backend
          sleep 20

      - name: Debug containers
        run: |
          docker compose ps
          docker compose logs backend
          docker compose logs db

      - name: Run Pytest inside Container
        run: |
          docker compose exec -T backend uv run pytest /app/tests -v
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+asyncpg://postgres:12345@db:5432/lms
          PYTHONPATH: .