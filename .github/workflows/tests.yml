name: Backend Dockerized Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # متغيرات ضرورية لكي لا ينهار الباك إند عند الإقلاع
      POSTGRES_PASSWORD: test_password
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'test_secret_key_123' }}
      DATABASE_URL: postgresql://postgres:test_password@db:5432/lms
      BACKEND_VOLUME_PATH: /tmp/ignore_me 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Dummy Dir for CI
        run: mkdir -p /tmp/ignore_me

      - name: Build and Start Services
        run: |
          # بناء وتشغيل الباك إند والقاعدة فقط
          docker compose up --build -d db backend

      - name: Wait for Services to be Ready
        run: |
          # 1. التأكد من جاهزية قاعدة البيانات
          echo "Waiting for Postgres..."
          docker compose exec -T db sh -c "until pg_isready -U postgres; do sleep 1; done"
          
          # 2. التأكد من أن الباك إند مستقر ولم ينهر (Crashed)
          echo "Checking Backend status..."
          if [ "$(docker inspect -f '{{.State.Running}}' $(docker compose ps -q backend))" != "true" ]; then
            echo "❌ Backend container crashed! Showing logs:"
            docker compose logs backend
            exit 1
          fi

      - name: Run Backend Pytest
        run: |
          # لاحظ حذف كلمة uv run لأن المكتبات مثبتة في النظام
          docker compose exec -T backend pytest tests/ -v
        env:
          PYTHONPATH: src

      - name: Check Logs on Failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs db