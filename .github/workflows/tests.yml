name: Backend Dockerized Tests

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      POSTGRES_PASSWORD: password
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/lms
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      API_URL: "http://localhost:8000"
      FRONTEND_URL: "http://localhost:5173"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Start Services
        run: docker compose up --build -d db backend

      - name: Wait for Services (Health Check)
        run: |
          echo "Waiting for DB..."
          docker compose exec -T db sh -c "until pg_isready -U postgres -d lms; do sleep 1; done"
          
          if [ "$(docker inspect -f '{{.State.Running}}' $(docker compose ps -q backend))" != "true" ]; then
            echo " Backend container crashed! Logs:"
            docker compose logs backend
            exit 1
          fi

      - name: Run Pytest inside Container
        run: |
          docker compose exec -T backend pytest tests/ -v
        env:
          PYTHONPATH: /app

      - name: Check Logs on Failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs db