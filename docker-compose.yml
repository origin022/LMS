services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=lms
      - PGDATA=/var/lib/postgresql/data/pgdata

    ports:
      - "5433:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - ./tests:/app/tests

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

    volumes:
      - ./frontend:/app

volumes:
  lms_postgres_data: 