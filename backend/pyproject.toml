[project]
name = "lms"
version = "0.1.0"
description = "LMS Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.120.0",
    "uvicorn>=0.38.0",
    "sqlmodel>=0.0.27",
    "psycopg[binary]>=3.2.12",
    "sympy>=1.12",
    "python-jose[cryptography]>=3.5.0",
    "pydantic-settings>=2.12.0",
    "email-validator>=2.3.0",
    "asyncpg>=0.31.0",
    "passlib>=1.7.4",
    "cryptography>=46.0.3",
    "python-multipart>=0.0.21",
    "redmail>=0.6.0",
    "google-generativeai>=0.8.6",
    "python-dotenv>=1.2.1",
    "alembic>=1.18.4",
    "groq>=1.0.0",
    "httpx>=0.28.1",
    "torch>=2.5.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-anyio>=0.0.0",
]
