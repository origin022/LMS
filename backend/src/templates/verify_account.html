<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تأكيد الحساب</title>
</head>
<body style="font-family: Arial, sans-serif; direction: rtl; text-align: center; background-color: #f8fafc; padding: 40px;">
    <div style="max-width: 550px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <h2 style="color: #1e293b;">مرحباً بك في منصة الجاحظ التعليمية</h2>
        <p style="color: #475569; font-size: 16px;">يرجى الضغط على الزر أدناه لتفعيل حسابك والبدء في رحلتك التعليمية معنا.</p>
        
        <a href="{{link}}" 
           style="
           display: inline-block;
           margin-top: 25px;
           padding: 14px 30px;
           background-color: #2563eb;
           color: #ffffff !important;
           text-decoration: none;
           border-radius: 12px;
           font-size: 18px;
           font-weight: bold;
           ">
           تأكيد تفعيل الحساب
        </a>
        
        <p style="margin-top: 30px; font-size: 12px; color: #94a3b8; line-height: 1.5;">
            هذا الرابط مخصص لك فقط وينتهي مفعوله تلقائياً بعد 24 ساعة.<br>
            إذا لم تقم بإنشاء حساب، يمكنك تجاهل هذا الإيميل.
        </p>
    </div>
</body>
</html>
